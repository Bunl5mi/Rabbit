<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兔兔窄屏测试台</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  padding:20px 14px 40px;
  background:#f4f4ef;
  color:#34362f;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}
main{
  max-width:800px;
  margin:auto;
}
h1{
  margin:0 0 8px;
  font-size:22px;
}
.intro{
  margin:0 0 20px;
  color:#777b70;
  font-size:13px;
  line-height:1.7;
}
.panel{
  padding:16px;
  border:1px solid #dcdfd3;
  background:#fff;
}
label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
}
input,button{
  font:inherit;
}
input[type="url"],
input[type="number"]{
  width:100%;
  min-width:0;
  height:42px;
  padding:8px 10px;
  border:1px solid #d5d9cb;
  border-radius:0;
  background:#fff;
  color:#34362f;
  font-size:16px;
}
button{
  min-height:40px;
  padding:8px 12px;
  border:1px solid #d5d9cb;
  border-radius:0;
  background:#fff;
  color:#565d4b;
  cursor:pointer;
}
button:active{
  background:#e9edde;
}
.load{
  width:100%;
  margin-top:9px;
  border-color:#596449;
  background:#596449;
  color:white;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}
.presets{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:12px 0;
}
.presets button{
  flex:1 0 58px;
  padding:8px 4px;
  font-size:13px;
}
.presets button.active{
  border-color:#596449;
  background:#e7eddc;
}
input[type="range"]{
  display:block;
  width:100%;
  margin:14px 0;
  accent-color:#596449;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.actions button{
  flex:1;
}
.status{
  margin:16px 0 10px;
  font-size:12px;
  line-height:1.7;
  color:#68715d;
}
.stage{
  width:100%;
  padding:12px;
  border:1px solid #cdd2c3;
  background:
    linear-gradient(45deg,#e2e5da 25%,transparent 25%),
    linear-gradient(-45deg,#e2e5da 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#e2e5da 75%),
    linear-gradient(-45deg,transparent 75%,#e2e5da 75%);
  background-color:#edf0e6;
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
.frame-space{
  position:relative;
  margin:0 auto;
}
.viewport{
  position:absolute;
  top:0;
  left:0;
  transform-origin:top left;
  background:white;
  outline:1px solid #7c886d;
}
iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:white;
}
.guides{
  position:absolute;
  inset:0;
  display:none;
  pointer-events:none;
  background:
    linear-gradient(
      to right,
      transparent calc(50% - .5px),
      rgba(210,55,85,.65) calc(50% - .5px),
      rgba(210,55,85,.65) calc(50% + .5px),
      transparent calc(50% + .5px)
    );
  box-shadow:
    inset 1px 0 #d23755,
    inset -1px 0 #d23755;
}
.guides.show{
  display:block;
}
.result{
  margin:12px 0 0;
  padding:12px;
  border:1px solid #dcdfd3;
  background:#fff;
  font-size:12px;
  line-height:1.8;
  overflow-wrap:anywhere;
}
.tip{
  margin-top:16px;
  color:#777b70;
  font-size:12px;
  line-height:1.8;
}
</style>
</head>
<body>
<main>
<h1>兔兔窄屏测试台</h1>
<p class="intro">
改变内部网页的真实视口宽度，检查文字、素材、按钮和预览排版。
</p>

<section class="panel">
  <label for="url">工具箱网页地址</label>
  <input
    id="url"
    type="url"
    placeholder="https://你的账号.github.io/仓库名/"
    spellcheck="false"
  >
  <button class="load" id="load">载入工具箱</button>

  <div class="grid">
    <div>
      <label for="width">测试宽度 / px</label>
      <input id="width" type="number" min="240" max="1024" value="320">
    </div>
    <div>
      <label for="height">测试高度 / px</label>
      <input id="height" type="number" min="400" max="1600" value="740">
    </div>
  </div>

  <div class="presets" id="presets">
    <button data-width="280">280</button>
    <button data-width="320">320</button>
    <button data-width="360">360</button>
    <button data-width="375">375</button>
    <button data-width="390">390</button>
    <button data-width="430">430</button>
    <button data-width="768">768</button>
  </div>

  <input
    id="range"
    type="range"
    min="240"
    max="1024"
    step="1"
    value="320"
    aria-label="测试窗口宽度"
  >

  <div class="actions">
    <button id="guide" aria-pressed="false">参考线：关</button>
    <button id="check">检查横向溢出</button>
  </div>
</section>

<div class="status" id="status"></div>

<div class="stage" id="stage">
  <div class="frame-space" id="space">
    <div class="viewport" id="viewport">
      <iframe id="frame" title="工具箱测试窗口" src="about:blank"></iframe>
      <div class="guides" id="guides"></div>
    </div>
  </div>
</div>

<div class="result" id="result" role="status">
载入网页后，可以直接在窗口里操作工具箱。
</div>

<p class="tip">
切换宽度不会重新载入网页，可以保留正在测试的内容。
同源网页支持检查横向溢出；不同域名的网页需要手动观察。
</p>
</main>

<script>
(function(){
  var $=function(id){
    return document.getElementById(id);
  };

  var frame=$('frame');
  var widthInput=$('width');
  var heightInput=$('height');
  var range=$('range');
  var loaded=false;

  function clamp(value,min,max,fallback){
    var number=Number(value);
    return Number.isFinite(number) && number>0
      ? Math.max(min,Math.min(max,number))
      : fallback;
  }

  function resize(){
    var width=clamp(widthInput.value,240,1024,320);
    var height=clamp(heightInput.value,400,1600,740);
    var available=Math.max(1,$('stage').clientWidth-24);
    var scale=Math.min(1,available/width);

    $('viewport').style.width=width+'px';
    $('viewport').style.height=height+'px';
    $('viewport').style.transform='scale('+scale+')';

    $('space').style.width=(width*scale)+'px';
    $('space').style.height=(height*scale)+'px';

    range.value=width;

    $('status').textContent=
      '内部视口：'+width+' × '+height+' px'+
      ' ｜ 外部显示比例：'+Math.round(scale*100)+'%';

    document.querySelectorAll('[data-width]').forEach(function(button){
      button.classList.toggle(
        'active',
        Number(button.dataset.width)===width
      );
    });
  }

  function loadPage(){
    var url;

    try{
      url=new URL($('url').value.trim(),location.href);

      if(!/^https?:$/.test(url.protocol)){
        throw new Error();
      }

      if(
        url.origin===location.origin &&
        url.pathname===location.pathname
      ){
        $('result').textContent='请填写工具箱地址，不要填写测试台自己的地址。';
        return;
      }
    }catch(error){
      $('result').textContent='请填写有效的 http 或 https 网页地址。';
      return;
    }

    loaded=true;
    frame.src=url.href;
    $('result').textContent=
      '正在载入。如果始终空白，请检查地址，以及目标网站是否允许嵌入。';

    try{
      localStorage.setItem('rabbitScreenTestUrl',url.href);
    }catch(error){}

    resize();
  }

  $('load').addEventListener('click',loadPage);

  frame.addEventListener('load',function(){
    if(loaded){
      $('result').textContent=
        '可以开始测试了：先操作工具箱，再切换不同宽度观察。';
    }
  });

  [widthInput,heightInput].forEach(function(input){
    input.addEventListener('input',resize);
  });

  range.addEventListener('input',function(){
    widthInput.value=this.value;
    resize();
  });

  $('presets').addEventListener('click',function(event){
    var button=event.target.closest('[data-width]');

    if(!button){
      return;
    }

    widthInput.value=button.dataset.width;
    resize();
  });

  $('guide').addEventListener('click',function(){
    var enabled=$('guides').classList.toggle('show');
    this.textContent='参考线：'+(enabled?'开':'关');
    this.setAttribute('aria-pressed',String(enabled));
  });

  $('check').addEventListener('click',function(){
    if(!loaded){
      $('result').textContent='请先载入工具箱。';
      return;
    }

    try{
      var doc=frame.contentWindow.document;
      var root=doc.documentElement;

      if(!root || !doc.body){
        throw new Error();
      }

      var viewportWidth=root.clientWidth;
      var contentWidth=Math.max(
        root.scrollWidth,
        doc.body.scrollWidth
      );

      var overflow=Math.max(
        0,
        contentWidth-viewportWidth
      );

      $('result').textContent=overflow>1
        ? '检测到页面横向溢出约 '+overflow+
          ' px。请检查是否有内容超出边缘；内部横向滚动列表不一定是错误。'
        : '没有检测到整页横向溢出。但文字错位、遮挡和被裁切仍需目视检查。';
    }catch(error){
      $('result').textContent=
        '浏览器不允许读取这个网页的内部尺寸。'+
        '测试窗口仍然可以使用，请手动观察；'+
        '把测试台与工具箱放在同一个域名下即可进行尺寸检查。';
    }
  });

  try{
    $('url').value=
      localStorage.getItem('rabbitScreenTestUrl') ||
      new URL('./',location.href).href;
  }catch(error){}

  window.addEventListener('resize',resize);

  if(window.ResizeObserver){
    new ResizeObserver(resize).observe($('stage'));
  }

  resize();
})();
</script>
</body>
</html>
